<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- theme-color follows the RESOLVED preset (blueprint §12.7): the
         bootstrap script sets it from each preset's --color-bg-base,
         ThemeProvider re-reads the live token after mount. The hexes are
         guarded against token drift by src/styles/tokens.test.ts. -->
    <meta name="theme-color" content="#081217" />
    <meta
      name="description"
      content="vesma-eyes — read-only viewer for vesma memory"
    />
    <title>vesma-eyes</title>
    <script>
      // Theme + preset bootstrap (themes-presets-wave1): resolves the FULL
      // look before first paint — a system-light user must never flash the
      // dark :root tokens, and a «Жила»/«Просвет» user must never flash the
      // canonical family either. Mirrors src/components/theme-provider.tsx —
      // keep the storage keys and resolution order in sync (guarded by
      // src/styles/tokens.test.ts):
      // - vesmaro.theme: "dark"/"light" = explicit family (UI-23; legacy
      //   mnemos-eyes:theme read-only fallback), absent = «Системная» (OS).
      // - vesmaro.appearance: {"lastDark","lastLight"} preset slots; the
      //   resolved preset = slots[family]; Колодец = NO data-theme attribute
      //   (dark :root), every other preset sets its [data-theme] scope.
      // theme-color rides the same resolution: PRESET_BASE mirrors each
      // preset's --color-bg-base (tokens.test.ts pins the hexes).
      try {
        var PRESET_BASE = {
          well: "#081217",
          zhila: "#17110b",
          sozvezdia: "#060a12",
          light: "#f5f6f8",
          prosvet: "#f4efe6"
        };
        var slots = { lastDark: "well", lastLight: "light" };
        try {
          var storedSlots = JSON.parse(
            localStorage.getItem("vesmaro.appearance") || "null"
          );
          if (
            storedSlots &&
            PRESET_BASE[storedSlots.lastDark] &&
            PRESET_BASE[storedSlots.lastLight]
          ) {
            slots = storedSlots;
          }
        } catch (_slotsError) {
          /* Corrupt slots record: canonical defaults. */
        }
        var stored = localStorage.getItem("vesmaro.theme");
        if (stored !== "light" && stored !== "dark") {
          stored = localStorage.getItem("mnemos-eyes:theme");
        }
        var family =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        var preset = family === "dark" ? slots.lastDark : slots.lastLight;
        if (preset !== "well") {
          document.documentElement.dataset.theme = preset;
        }
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute("content", PRESET_BASE[preset]);
        }
      } catch (_error) {
        /* Storage unavailable: keep the dark Колодец defaults. */
      }
    </script>
    <script>
      // Density bootstrap (Ф1, concept §3.3): applies the stored compact
      // choice before first paint so compact users never see comfortable row
      // heights flash. Mirrors src/components/density-provider.tsx — keep the
      // "vesmaro.density" key and the comfortable default in sync.
      try {
        var density = localStorage.getItem("vesmaro.density");
        document.documentElement.dataset.density =
          density === "compact" ? "compact" : "comfortable";
      } catch (_error) {
        /* Storage unavailable: comfortable :root defaults. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

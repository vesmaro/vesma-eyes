{{- /* ADR 0011 Ф4 root-UI switch: reject typos at render time so a bad
     --set rootApp=... can never land (the server also fails safe to
     board on unknown values, this gate just makes it loud and early). */}}
{{- if not (has (default "board" .Values.rootApp) (list "board" "app")) }}
{{- fail (printf "rootApp must be 'board' or 'app', got %q (ADR 0011 Ф4)" .Values.rootApp) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vesmaro-eyes.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesmaro-eyes.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.strategy }} # Recreate: RWO local-path PVC, single replica
  selector:
    matchLabels:
      {{- include "vesmaro-eyes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vesmaro-eyes.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # NO hostNetwork: traefik reaches the pod over the ingress path once
      # the agentsnode-policies netpol admits it (deploy/netpol-traefik-fix.md).
      serviceAccountName: {{ include "vesmaro-eyes.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- if .Values.models.secretsDir.enabled }}
      {{- /* Issue #5 (MF3 threat model §6: "vault files 0600, dir not
           world-readable"): the local-path provisioner creates the vault
           dir 0777+setgid (drwxrwsrwx) and kubelet's fsGroup pass cannot
           produce 0700, so the pod fixes the ROOT dir itself on start —
           chown to the run-as uid/gid, chmod 0700 (setgid cleared).
           Vault FILES are never touched here: the server writes them
           0600 by construction. The init re-runs on every pod start and
           is idempotent; kubelet's OnRootMismatch pass stays quiet
           because uid/gid already match fsGroup afterwards. Runs as root
           (deliberate override of the pod securityContext — a non-owner
           cannot chmod) with every capability dropped except CHOWN and
           FOWNER. */}}
      initContainers:
        - name: vault-perms
          image: {{ include "vesmaro-eyes.image" . }}
          # IfNotPresent on purpose: same pinned tag as the main container
          # (already on the node) — a pod start never depends on registry
          # reachability for a perms fix.
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              chown {{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.runAsGroup }} {{ .Values.models.secretsDir.mountPath }}
              && chmod 0700 {{ .Values.models.secretsDir.mountPath }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: vault
              mountPath: {{ .Values.models.secretsDir.mountPath }}
      {{- end }}
      containers:
        - name: eyes
          image: {{ include "vesmaro-eyes.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: MNEMOS_URL
              value: {{ .Values.mnemos.cluster.url | quote }}
            - name: MNEMOS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "mnemos.cluster.existingSecret is required" .Values.mnemos.cluster.existingSecret }}
                  key: {{ required "mnemos.cluster.existingSecretKey is required" .Values.mnemos.cluster.existingSecretKey }}
            {{- if .Values.mnemos.laptop.enabled }}
            - name: MNEMOS_LAPTOP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "mnemos.laptop.existingSecret is required" .Values.mnemos.laptop.existingSecret }}
                  key: {{ required "mnemos.laptop.existingSecretKey is required" .Values.mnemos.laptop.existingSecretKey }}
            {{- end }}
            - name: VESMARO_BOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vesmaro-eyes.boardTokenSecretName" . }}
                  key: {{ .Values.boardToken.existingSecretKey }}
            {{- if .Values.uiToken.enabled }}
            # ADR 0009 A1 token split — CLOSED (transitional retired
            # server-side in 1.93): the ui class takes ONLY this token;
            # the board token stays machine-class (poller/agents). With
            # uiToken.enabled=false the ui class fail-closes to 503.
            - name: VESMARO_UI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vesmaro-eyes.uiTokenSecretName" . }}
                  key: {{ .Values.uiToken.existingSecretKey }}
            {{- end }}
            {{- if .Values.memoryRegistry.configMap.create }}
            - name: VESMARO_MEMORY_CONFIG
              value: /config/memories.yaml
            {{- end }}
            - name: VESMARO_ALLOWED_MEMORY_HOSTS
              value: {{ required "memoryHostsAllowlist is required" .Values.memoryHostsAllowlist | quote }}
            {{- /* ADR 0011 Ф4: which UI owns "/" (RUNBOOK.md §9). board is
                 the default; the flip is one helm upgrade --set rootApp=app
                 and rolls back the same way — no image rebuild. */}}
            - name: VESMARO_ROOT_APP
              value: {{ default "board" .Values.rootApp | quote }}
            {{- /* Roster order: the hermes bridge executor reads HERMES_HOST
                 and binds its registry rows to this host; empty falls back to
                 "cluster". fieldRef keeps it zero-hardcode — the host row is
                 whatever node actually runs the board pod. */}}
            - name: HERMES_HOST
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.pollerBootstrap.caFile.enabled }}
            - name: VESMARO_TLS_CA_FILE
              value: /etc/vesmaro/tls/ca.crt
            {{- end }}
            {{- if .Values.models.secretsDir.enabled }}
            # MF2/MF3 credential vault (H1): a dedicated volume OUTSIDE the
            # data dir — the data dir stays keyless BY CONSTRUCTION. The
            # OWNER installs keys through the board UI; deploy never
            # writes vault contents (the existingSecret discipline).
            - name: VESMARO_SECRETS_DIR
              value: {{ .Values.models.secretsDir.mountPath | quote }}
            {{- end }}
            {{- /* MF3 pull-proxy knobs (threat model §6): read once at
                 boot, server-clamped to the §2-D ceilings (stricter
                 only). enabled=false = the honest 503 off on both infer
                 routes. */}}
            {{- if .Values.models.proxy.enabled }}
            - name: MODELS_PROXY_ENABLED
              value: "1"
            {{- else }}
            - name: MODELS_PROXY_ENABLED
              value: "0"
            {{- end }}
            - name: MODELS_PROXY_BODY_CAP_BYTES
              value: {{ .Values.models.proxy.bodyCapBytes | quote }}
            - name: MODELS_PROXY_MODEL_ID_MAX
              value: {{ .Values.models.proxy.modelIdMax | quote }}
            - name: MODELS_PROXY_CONNECT_SECONDS
              value: {{ .Values.models.proxy.timeouts.connectSeconds | quote }}
            - name: MODELS_PROXY_FIRST_BYTE_SECONDS
              value: {{ .Values.models.proxy.timeouts.firstByteSeconds | quote }}
            - name: MODELS_PROXY_IDLE_READ_SECONDS
              value: {{ .Values.models.proxy.timeouts.idleReadSeconds | quote }}
            - name: MODELS_PROXY_TOTAL_SECONDS
              value: {{ .Values.models.proxy.timeouts.totalSeconds | quote }}
            - name: MODELS_PROXY_PER_EXECUTOR_INFLIGHT
              value: {{ .Values.models.proxy.limits.perExecutorInFlight | quote }}
            - name: MODELS_PROXY_GLOBAL_INFLIGHT
              value: {{ .Values.models.proxy.limits.globalInFlight | quote }}
            - name: MODELS_PROXY_PER_EXECUTOR_PER_MINUTE
              value: {{ .Values.models.proxy.limits.perExecutorPerMinute | quote }}
            - name: MODELS_PROXY_GLOBAL_PER_MINUTE
              value: {{ .Values.models.proxy.limits.globalPerMinute | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.probes }}
          # All probes hit /api/health which pings every registered mnemos
          # server (cluster + laptop) — slow by design, timeouts sized for it.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .startup.periodSeconds }}
            failureThreshold: {{ .startup.failureThreshold }}
            timeoutSeconds: {{ .startup.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .readiness.periodSeconds }}
            failureThreshold: {{ .readiness.failureThreshold }}
            timeoutSeconds: {{ .readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .liveness.periodSeconds }}
            failureThreshold: {{ .liveness.failureThreshold }}
            timeoutSeconds: {{ .liveness.timeoutSeconds }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.models.secretsDir.enabled }}
            - name: vault
              mountPath: {{ .Values.models.secretsDir.mountPath }}
            {{- end }}
            {{- if .Values.memoryRegistry.configMap.create }}
            - name: memories-config
              mountPath: /config
              readOnly: true
            {{- end }}
            {{- if .Values.pollerBootstrap.caFile.enabled }}
            - name: tls-ca
              mountPath: /etc/vesmaro/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vesmaro-eyes.pvcName" . }}
        {{- if .Values.models.secretsDir.enabled }}
        - name: vault
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-vault" (include "vesmaro-eyes.fullname" .)) .Values.models.secretsDir.existingClaim }}
        {{- end }}
        {{- if .Values.memoryRegistry.configMap.create }}
        - name: memories-config
          configMap:
            name: {{ include "vesmaro-eyes.fullname" . }}-memories
        {{- end }}
        {{- if .Values.pollerBootstrap.caFile.enabled }}
        - name: tls-ca
          secret:
            secretName: {{ default .Values.ingress.tls.secretName .Values.pollerBootstrap.caFile.existingSecret }}
            # optional: an install without the TLS secret must NOT hang on
            # FailedMount — the empty mount means no file, which the route
            # answers with its honest fail-closed 503 (the values comment).
            optional: true
            items:
              # PUBLIC material only — the private key never leaves the secret.
              - key: tls.crt
                path: ca.crt
        {{- end }}

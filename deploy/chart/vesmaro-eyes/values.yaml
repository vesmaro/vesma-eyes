# Default values for vesmaro-eyes.
# Comments are normative; keep them in sync with templates and RUNBOOK.md.

nameOverride: ""
fullnameOverride: ""

# Release naming contract (see RUNBOOK.md): deploy as
#   helm install vesmaro-eyes deploy/chart/vesmaro-eyes -n kube-agents
# so pre-existing bare resources (deployment/service/ingress/pvc named
# vesmaro-eyes*) are adopted instead of colliding.

image:
  repository: ghcr.io/vesmaro/vesma-eyes
  # Explicit tag synced from server/app.py by scripts/sync-version.sh.
  # If left empty, .Chart.AppVersion is used.
  tag: "1.97.0"
  pullPolicy: Always

# Both registry pull secrets are listed on purpose (ghcr-403 incident,
# 2026-09-29, second occurrence): kubelet falls through the list until one
# authenticates, so a revoked/expired credential in a single secret no
# longer takes prod down. Rotate in place OR refresh ghcr-pull-w26.
imagePullSecrets:
  - name: ghcr-pull
  - name: ghcr-pull-w26

serviceAccount:
  create: true
  name: ""
  # The board never talks to the Kubernetes API.
  automountServiceAccountToken: false

podAnnotations: {}

podLabels: {}

# --- ADR 0011 Ф4: root UI switch -------------------------------------------
# Which UI owns "/": board (default — frozen board at /, React viewer at
# /app) or app (viewer at / with history fallback, frozen board at /board,
# /app 302 -> / so old bookmarks survive). Pure routing: no data, no image
# rebuild — the flip re-creates the pod with a different env only.
# Flip ONLY per RUNBOOK.md §9 (owner sign-off after the parity round):
#   helm upgrade vesmaro-eyes deploy/chart/vesmaro-eyes -n kube-agents --set rootApp=app
# Rollback is the mirror-image one-liner (--set rootApp=board).
# Anything but board|app fails `helm template`/`helm upgrade` (and the
# server itself fails safe to board on top of that).
rootApp: board

# Egress allowlist for memory-server URLs added/edited via the API (SEC-1):
# hosts outside the list are rejected 422. Default covers this lab —
# in-cluster mnemos service name, LAN range for the laptop store,
# .abyss.lab hostnames, loopback for local checks. Extend when adding
# stores with other hosts. W5: the mesh-node healthz base_url
# (http://mnemos-mesh-peer.kube-agents.svc.cluster.local:9090) goes
# through the same validator, so its FQDN must be allowed too.
memoryHostsAllowlist: "agentsnode-mnemos,mnemos-mesh-peer.kube-agents.svc.cluster.local,192.168.1.0/24,.abyss.lab,localhost,127.0.0.1"

# --- secrets -------------------------------------------------------------
boardToken:
  # VESMARO_BOARD_TOKEN (write guard, fail-closed). By default the chart
  # creates the secret on first install with randAlphaNum(48) and REUSES
  # the existing value on every later upgrade (lookup-based). Set
  # existingSecret to skip chart generation entirely and reference a
  # secret you manage yourself.
  existingSecret: ""
  existingSecretKey: VESMARO_BOARD_TOKEN

uiToken:
  # VESMARO_UI_TOKEN (ui-class write guard, ADR 0009 A1 token split —
  # the split is CLOSED, transitional closed: the server no longer
  # accepts the board token on ui-class mutations). MANDATORY for the
  # owner UI: with enabled=false no secret is created and no env reaches
  # the pod, so every ui-class mutation AND the owner login answer
  # fail-closed 503 (the transition mode that let the board token serve
  # the UI was retired server-side in 1.93). Keep enabled=true; the value
  # is chart-generated on first enable (randAlphaNum(48), lookup-stable
  # across upgrades, kept on uninstall) or referenced via existingSecret.
  enabled: true
  existingSecret: ""
  existingSecretKey: VESMARO_UI_TOKEN

mnemos:
  cluster:
    url: http://agentsnode-mnemos:8787
    # Existing out-of-band secret (board bearer token, mnk_..., totp_required=0).
    # NEVER overwritten by the chart. Required.
    existingSecret: vesmaro-eyes-mnemos
    existingSecretKey: MNEMOS_TOKEN
  laptop:
    # Laptop mnemos store (LAN bind 8788). Only the token env is injected;
    # the server row itself lives in the board registry (SQLite).
    enabled: true
    existingSecret: vesmaro-eyes-laptop
    existingSecretKey: MNEMOS_LAPTOP_TOKEN

# Legacy seed file /data/memories.yaml. The live registry is DB-backed
# (board.db on the PVC) and already seeded on this cluster, so the ConfigMap
# stays disabled by default. Enable only for FRESH installs to seed servers
# on first boot (mounted read-only at /config, VESMARO_MEMORY_CONFIG points
# there; it never shadows the PVC).
memoryRegistry:
  configMap:
    create: false
    content: {}
    # servers:
    #   - name: cluster
    #     url: http://agentsnode-mnemos:8787
    #     token_env: MNEMOS_TOKEN
    #     group: abyss
    #     primary: true

# --- models fleet (MF2 credentials + MF3 grants/pull-proxy) ---------------
models:
  secretsDir:
    # The credential vault (security verdict H1): a DEDICATED volume
    # OUTSIDE the board data PVC — the data dir stays keyless BY
    # CONSTRUCTION. The chart creates the empty volume and mounts it
    # read-write; the OWNER installs keys through the board UI (the one
    # write path, files 0600). deploy NEVER writes, copies or overwrites
    # vault contents (the existingSecret discipline: referenced, never
    # managed). Absent dir = credential features honestly off (503
    # family), never a DB fallback.
    # Dir perms (issue #5, MF3 threat model §6 "dir not world-readable"):
    # the local-path provisioner creates the vault dir world-writable +
    # setgid (drwxrwsrwx), so the chart ships a `vault-perms` initContainer
    # that chowns the dir to runAsUser/runAsGroup and chmods it 0700 on
    # every pod start. Vault FILES stay 0600 by the server's construction
    # and are never touched by the init.
    enabled: true
    # Empty -> chart-managed PVC "<fullname>-vault". A pre-provisioned
    # volume can be referenced instead (operator-owned contents).
    existingClaim: ""
    storageClass: local-path
    size: 64Mi
    mountPath: /vault
    keepOnUninstall: true
  proxy:
    # The MF3 inference pull-proxy (mf3-threat-model.md §2-D/§6). The
    # numbers are SERVER-OWNED constants at the §2-D values; these env
    # knobs are read once at boot and may only TIGHTEN them (clamped to
    # the §2-D ceiling — "at the §2-D numbers (or stricter)"). They are
    # never per-request tunable. enabled=false answers both infer routes
    # with the honest 503 off. Natural default: on iff the secrets dir is
    # configured.
    enabled: true
    bodyCapBytes: 4194304
    modelIdMax: 200
    timeouts:
      connectSeconds: 5
      firstByteSeconds: 30
      idleReadSeconds: 60
      totalSeconds: 300
    limits:
      perExecutorInFlight: 2
      globalInFlight: 16
      perExecutorPerMinute: 20
      globalPerMinute: 120

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  host: vesmaro.abyss.lab
  tls:
    # Self-signed cert for the lab domain; browser warning is accepted
    # (documented in RUNBOOK.md). Create the secret with
    # scripts/gen-tls-secret.sh BEFORE the first install.
    enabled: true
    secretName: vesmaro-eyes-tls
  labels: {}
  annotations: {}

pollerBootstrap:
  # Wave 3D: GET /api/poller/artifacts/ca.crt serves the lab CA so the
  # one-command bootstrap can PIN it on the VPS (the self-signed leaf cert
  # IS its own anchor). The cert is public material (tls.key is NOT
  # mounted); it lives in the k8s TLS secret that gen-tls-secret.sh
  # creates BEFORE the first install — this mounts its PUBLIC tls.crt into
  # the container. With enabled: false (or the secret absent at install
  # time) the route answers an honest 503 and the bootstrap falls back to
  # the manual CA path (REMOTE-EXECUTOR.md §3).
  caFile:
    enabled: true
    # Empty -> ingress.tls.secretName (the same cert terminates on traefik).
    existingSecret: ""

persistence:
  # Empty -> chart-managed PVC named "<fullname>-data"
  # (vesmaro-eyes-data for the canonical release name, which matches the
  # pre-existing local-path PVC — adopt it, see RUNBOOK.md).
  existingClaim: ""
  storageClass: local-path
  size: 1Gi
  accessMode: ReadWriteOnce
  # helm.sh/resource-policy: keep — survives `helm uninstall`, the board
  # DB must never be garbage-collected by a release operation.
  keepOnUninstall: true

replicaCount: 1
strategy: Recreate
revisionHistoryLimit: 5

containerPort: 8080

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# /api/health is EXPENSIVE: it pings every registered mnemos server
# (cluster + laptop) on each call. All probe timings are sized for that;
# do not shorten timeoutSeconds without re-measuring (RUNBOOK.md).
probes:
  startup:
    periodSeconds: 5
    failureThreshold: 24 # up to 120s for first boot + mnemos pings
    timeoutSeconds: 12
  readiness:
    periodSeconds: 30
    timeoutSeconds: 12
    failureThreshold: 2
  liveness:
    periodSeconds: 90
    timeoutSeconds: 14
    failureThreshold: 3

extraEnv:
  # ADR 0012 §3.1 (RUNBOOK §10.1): uvicorn --proxy-headers trusts
  # X-Forwarded-For only from these peers. "*" is safe here: the chart
  # NetworkPolicy admits ingress from the traefik namespace only (the LAN
  # diagnostics window ships disabled) — without this the pairing
  # source-IP binding and per-IP rate limits key on the ingress pod IP.
  - name: FORWARDED_ALLOW_IPS
    value: "*"
  # Hermes bridge (T004, owner directive 2026-10-10): HERMES_API_KEY reaches
  # the pod from the out-of-band secret `hermes-api-key` (created by the
  # release train from the live hermes pod's API_SERVER_KEY; the value is
  # never printed and never generated by the chart). The secret must exist
  # BEFORE the upgrade or the container stays in CreateContainerConfigError.
  # Absent/empty key = the bridge answers an honest 503 hermes_off. Default
  # HERMES_ENDPOINT is agentsnode-hermes-clusterip:8642; egress is allowed
  # by the shared agentsnode-policies netpol (port 8642, podSelector {}).
  - name: HERMES_API_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-api-key
        key: key
#  - name: EXAMPLE
#    value: "value"

# --- NetworkPolicy (SEC-3 AMEND) ------------------------------------------
# Default-deny pod for the board itself. NOTE: the foreign shared policy
# agentsnode-policies (helm chart agentsnode-policies-0.1.8) ALSO applies to
# this pod via the part-of=agentsnode label; netpol semantics are a UNION,
# so the effective access is the union of both policies (verified against
# the live policy on 2026-09-16, see deploy/netpol-traefik-fix.md).
networkPolicy:
  enabled: true
  ingress:
    traefik:
      enabled: true
      # Matches the live traefik pod:
      #   ns kube-system (kubernetes.io/metadata.name=kube-system)
      #   pod app.kubernetes.io/name=traefik
      namespaceLabel:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
    # Direct LAN access to the POD (bypassing traefik) for diagnostics.
    # Off by default; enable for a diagnostics window, then disable again.
    allowLan:
      enabled: false
      cidr: 192.168.1.0/24
      ports:
        - port: 8080
          protocol: TCP
  egress:
    dns:
      enabled: true
      namespaceLabel:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # In-cluster mnemos (agentsnode-mnemos:8787), same namespace.
    mnemos:
      enabled: true
      podSelector:
        app.kubernetes.io/name: mnemos
      ports:
        - port: 8787
          protocol: TCP
    # Laptop mnemos store over LAN.
    lan:
      enabled: true
      cidr: 192.168.1.0/24
      ports:
        - port: 8788
          protocol: TCP
    # Escape hatch for future registered stores.
    # W5: mesh-node healthz — the agentsnode-mnemos sidecar (mesh node
    # "cluster") serves GET /healthz on its metrics listener :9090. The
    # selector is the mesh-owned additive label (the ONLY selector of
    # the mnemos-mesh-peer Service/NP in the mnemos-mesh repo), NOT the
    # chart's app.kubernetes.io/name label.
    extra:
      - to:
          - podSelector:
              matchLabels:
                vesma-mesh.korrnals.com/node: cluster
        ports:
          - port: 9090
            protocol: TCP

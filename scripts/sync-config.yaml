          исключённого container-deployment
      - path: admin/ssh-sync-hardening.md
        reason: >-
          решение W2: усиление ssh-синка апстрима — наши runbook-страницы
          на него не смотрят
      - path: admin/runbooks/migrate.md
        reason: >-
          решение W2: разовая миграция с ai-brain (проект-предшественник,
          которого в экосистеме борда нет); ссылка из cli-reference (en+ru)
          переписана overlay'ем на GitHub
      - path: admin/runbooks/container-deployment.md
        reason: >-
          решение W2: установочный путь апстрима (готовый образ/compose) —
          наш deploy.md считает mnemos готовой предпосылкой и не смотрит на
          этот ранбук; шесть входящих ссылок из getting-started/install
          (en+ru) переписаны overlay'ем на GitHub
      - path: admin/runbooks/dependency-updates.md
        reason: >-
          решение W2: зависимости mnemos обновляют мейнтейнеры апстрима
          (наш upgrade.md управляет только тегом образа борда); ссылка из
          getting-started (en+ru) переписана overlay'ем на GitHub
      - path: admin/runbooks/ci-cd.md
        reason: CI-рутина релизов апстрима — не для пользователей борда
      - path: admin/runbooks/pypi-publish.md
        reason: релизная рутина мейнтейнеров апстрима
      - path: admin/runbooks/git-workflow-notes.md
        reason: внутренний процесс разработки апстрима
      - path: admin/runbooks/edge-stats-maintenance.md
        reason: узкая операционная рутина апстрима
      # --- ре-пин 2026-10-23 (docs-engine-freshness): новые страницы 6.x ----
      # Вердикты того же класса, что решения W2; каждая входит входящими
      # ссылками в включённые страницы — ссылки уводятся overlay'ем на
      # GitHub @ пина (контракт §6.1). Кандидаты на включение (решение
      # Docs Writer, не волны): migration-6-0, project-graph.
      - path: user/migration-6-0.md
        reason: >-
          ранбук переезда 5.x→6.0 апстрима; оператор борда ставит vesma
          готовой предпосылкой (наш upgrade.md управляет только тегом
          образа борда) — решение W2-класса, кандидат на включение
      - path: user/project-graph.md
        reason: >-
          гид по графу кода (ADR-0032) — поверхность разработчика/MCP,
          контракт §3 держит пользователя борда на операторских страницах;
          решение W2-класса, кандидат на включение
      - path: user/api-surface-parity.md
        reason: >-
          внутренняя запись паритета CLI/REST/MCP апстрима — реестр для
          мейнтейнеров, не операторская страница
      - path: dev/
        reason: >-
          новая dev/-зона 6.x (release-pipeline) — релизная рутина
          мейнтейнеров апстрима, как ci-cd/pypi-publish
      - path: project/
        reason: >-
          внутреннее: ADR, планы, отчёты сессий — не пользовательская
          документация (контракт §3, строка «project/ … нет»)
      - path: experiments/
        reason: внутренние эксперименты апстрима (контракт §3)
    overlays:
      # Демо-правила W1a (механика якорных замен; тело апстрима не
      # редактируется вне этого механизма — контракт §2).
      # Ре-пин 2026-10-23: апстрим 6.4.0 переформулировал пункт в чекбокс
      # роадмапа «- [ ] Web UI (vesma-eyes)» — имя уже правильное, но борд
      # при этом ЖИВОЙ (эти доки читаются на нём). Вердикт: политика та же
      # («читателю указывают на живой борд»), якорь перенесён на чекбокс,
      # отмечаем его живым — форма списка сохранена.
      - file: en/architecture/overview.md
        find: "- [ ] Web UI (vesma-eyes)"
        replace: "- [x] Web UI (vesma-eyes) — live: the board serving this documentation"
        reason: >-
          адаптация контекста: пункт роадмапа «запланирован» отмечен живым —
          борд vesma-eyes существует и раздаёт эти доки (решение АРХКОМ-7 о
          трёхпроектных доках; перенесено на чекбокс 6.4.0)
      - file: ru/architecture/overview.md
        find: "- [ ] Web UI (vesma-eyes)"
        replace: "- [x] Web UI (vesma-eyes) — живой: борд, на котором вы читаете эту документацию"
        reason: RU-зеркало правила выше


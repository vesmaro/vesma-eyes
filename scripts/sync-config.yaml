# ============================================================================
# Docs upstream import — L1 configuration (ARCHCOM-7 contract 2026-09-23,
# §2 layers, §3 selection matrix). Consumed by scripts/sync_docs.py.
#
# Layers: L0 = local clones pinned by `ref` (full SHA, honestly pinned —
# sync FAILS if a clone has tracked modifications). L1 = this file + the
# script (selection, normalization, overlays, link rewriting, vendoring).
# L2 = generated corpus under viewer/src/features/docs/content/upstream/
# plus vendored assets and the provenance/sidecar manifests. L2 is
# read-only for humans: style changes go through `overlays` here; an
# overlay anchor that no longer matches = sync failure (upstream drift
# signal, contract §6.3).
#
# Selection rule (contract §6.6): ONLY `include` entries are generated.
# `exclude` entries document why a path stays out; the script refuses a
# config where an include matches an exclude.
# ============================================================================

projects:
  # ---------------------------------------------------------------- mnemos ---
  mnemos:
    repo: ../vesma
    # Reader-facing product name for the provenance stamp/badge (directive
    # 2026-10-23: the stamp must speak the DISPLAY name, not the internal
    # slug). The slug `mnemos` stays the URL/slug namespace for link
    # stability (docs-engine-freshness decision); this field is display-only.
    # Absent (or equal to the slug) → the slug is shown as-is.
    display_name: Vesma
    # Re-pinned 2026-10-23 (docs-engine-freshness wave; was 8bc139bf0749,
    # 2026-09-29/ME-039 — a month stale across the 5.x→6.0→6.4 rebrand).
    # 03d30d47 = release tag v6.4.0 (the 6.4.x generation release commit:
    # layout v2 waves 3-4, docs actualization). Anchored on the TAG
    # generation per the wave contract; the full SHA is recorded (honest
    # clone discipline), the tag is named here so the next re-pin knows
    # the anchor kind.
    ref: 03d30d47d2147411dfc5b08ca68c4dfd3516f24f
    # Non-docs links (CONTRIBUTING.md, config.example.yaml, …) are rewritten
    # to this template at the pinned SHA; {sha} is substituted.
    web_base: "https://github.com/vesmaro/vesmaro/blob/{sha}"
    locale_dirs:
      en: docs/en
      ru: docs/ru
    include:
      # --- user/ — целиком, 10 файлов (контракт §3, строка 1). -------------
      # note: — кураторское интро W2 (единственное место пересказа; тело
      # апстрима не редактируется, контракт §2). Фронтенд показывает его
      # блоккетом под banner'ом GENERATED.
      - path: user/getting-started.md
        category: mnemos-user
        order: 1
        note:
          en: >-
            Curator: the complete first run of Vesma — one-line install,
            first memory, first search, connecting an agent harness.
          ru: >-
            Куратор: полный первый прогон vesma — установка одной командой,
            первая запись, первый поиск, подключение агента-харнеса.
      - path: user/integration-guide.md
        category: mnemos-user
        order: 2
        note:
          en: >-
            Curator: behavioral triggers that make agents actually use the
            memory — session-start recall, checkpoints, mandatory tags.
          ru: >-
            Куратор: поведенческие триггеры, которые заставляют агентов
            реально пользоваться памятью, — recall в начале сессии,
            чекпоинты, обязательные теги.
      - path: user/sync.md
        category: mnemos-user
        order: 3
        note:
          en: >-
            Curator: offline batch sync between two Vesma instances via
            cron and rsync — Vesma itself makes no network calls.
          ru: >-
            Куратор: офлайн-синхронизация двух инстансов vesma по cron
            и rsync — vesma сам сетевых вызовов не делает.
      - path: user/context-filter.md
        category: mnemos-user
        order: 4
        note:
          en: >-
            Curator: the five-stage pipeline cleaning raw content before a
            model sees it — what the board shows as «raw → processed».
          ru: >-
            Куратор: пятиступенчатый конвейер очистки сырья до подачи в
            модель — то, что борд показывает как «сырое → обработано».
      - path: user/tag-contract.md
        category: mnemos-user
        order: 5
        note:
          en: >-
            Curator: the mandatory tag schema — mnemos:* prefixes, allowed
            values, migration; the board's «vesma tags» field follows it.
          ru: >-
            Куратор: обязательная схема тегов — префиксы mnemos:,
            допустимые значения, миграция; поле «Теги vesma» у задач борда
            живёт по этому контракту.
      - path: user/metrics.md
        category: mnemos-user
        order: 6
        note:
          en: >-
            Curator: the stats HTTP endpoints and the Prometheus
            exposition behind the board's «Пульс» feed and overview stats.
          ru: >-
            Куратор: HTTP-эндпоинты статистики и Prometheus-экспозиция,
            на которых держатся «Пульс» и «Обзор» борда.
      - path: user/export-import.md
        category: mnemos-user
        order: 7
        note:
          en: >-
            Curator: backup, move, and restore Vesma memories via CLI or
            HTTP API — JSON with metadata or full SQLite snapshots.
          ru: >-
            Куратор: резервные копии и перенос записей vesma через CLI
            или HTTP API — JSON с метаданными или полные SQLite-снимки.
      - path: user/cli-reference.md
        category: mnemos-user
        order: 8
        note:
          en: >-
            Curator: complete reference for the vesma CLI — every
            subcommand with runnable examples.
          ru: >-
            Куратор: полный справочник CLI vesma — все подкоманды
            с запускабельными примерами.
      - path: user/http-api.md
        category: mnemos-user
        order: 9
        note:
          en: >-
            Curator: the full HTTP surface of Vesma — memory, search,
            pipeline, DLQ, traces, A2A sessions; the requests the board
            makes to stores.
          ru: >-
            Куратор: полная HTTP-поверхность vesma — память, поиск,
            конвейер, DLQ, трассировки, A2A-сессии; именно этими запросами
            борд читает хранилища.
      - path: user/mcp-tools.md
        category: mnemos-user
        order: 10
        note:
          en: >-
            Curator: all vesma_* tools for MCP clients — the same layer
            agents on the board use to work with memory.
          ru: >-
            Куратор: все инструменты vesma_* для MCP-клиентов — тот же
            слой, через который агенты работают с памятью на борде.
      # --- admin/ — ФИНАЛЬНЫЙ список W2 (контракт §3: страницы, на которые
      # --- смотрят наши runbook-страницы; решение по кандидатам — в exclude).
      - path: admin/security.md
        category: mnemos-admin
        order: 1
        note:
          en: >-
            Curator: the Vesma security posture — TOTP, non-loopback
            guard, threat model; background for the board's tokens page.
          ru: >-
            Куратор: позиция безопасности vesma — TOTP, не-loopback guard,
            модель угроз; фон для страницы борда «Токены и доступ».
      - path: admin/federation.md
        category: mnemos-admin
        order: 2
        note:
          en: >-
            Curator: federation on the Vesma side — per-peer ACL, trigger
            codes, access log; the foundation of the observed mesh nodes.
          ru: >-
            Куратор: федерация на стороне vesma — per-peer ACL, коды
            триггера, журнал доступа; фундамент наблюдаемых «Узлов меша».
      - path: admin/runbooks/install.md
        category: mnemos-admin
        order: 3
        note:
          en: >-
            Curator: installing Vesma — the board's prerequisite: PyPI
            install, first run, the mnk_… token for the store hookup.
          ru: >-
            Куратор: установка vesma — предпосылка борда: PyPI-установка,
            первый запуск, токен mnk_… для подключения хранилища.
      # W2, решение по кандидату: наша backup-restore.md копирует
      # mnemos.db/vectors.db — апстрим-ранбук про то же, глубже.
      - path: admin/runbooks/backup-restore.md
        category: mnemos-admin
        order: 4
        note:
          en: >-
            Curator: the upstream runbook for backing up and restoring
            Vesma data — goes deeper than the board's own backup page.
          ru: >-
            Куратор: апстрим-ранбук бэкапа и восстановления данных vesma —
            глубже нашей страницы «Бэкап и восстановление».
      # --- architecture/ — одна обзорная (контракт §3) ---------------------
      - path: architecture/overview.md
        category: mnemos-architecture
        order: 1
        note:
          en: >-
            Curator: how Vesma is built — hybrid memory, the CLI/HTTP/MCP
            surfaces, and where vesmaro-eyes fits.
          ru: >-
            Куратор: как устроен vesma — гибридная память, поверхности
            CLI/HTTP/MCP и место vesmaro-eyes в картине.
    exclude:
      # --- W2-решения по висящим слагам (ссылки из включённых страниц) -----
      - path: architecture/a2a-sessions.md
        reason: >-
          решение W2: спека A2A для агентов/MCP-оркестраторов — поверхность
          разработчика, не операторская; контракт §3 держит architecture/
          как одну обзорную. Три ссылки из http-api (en+ru) переписаны
          overlay'ем на GitHub
      - path: index.md
        reason: >-
          апстрим-индекс дублирует хабы борда; хабы проекта строит волна W1c
      - path: features.md
        reason: обзорный маркетинг апстрима, дублирует user/ страницы
      - path: admin/federation-testing.md
        reason: >-
          решение W2: QA-гайд проверки федерации перед релизом апстрима —
          борд только наблюдает узлы меша и федерацию не эксплуатирует;
          ссылка из admin/federation (en+ru) переписана overlay'ем на GitHub
      - path: admin/kubernetes-deployment.md

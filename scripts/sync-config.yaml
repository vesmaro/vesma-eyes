        reason: RU-зеркало правила выше

  # ----------------------------------------------------------- mnemos-mesh ---
  mnemos-mesh:
    repo: ../mnemos-mesh
    # Pinned 2026-09-29 (ME-039 re-sync; was 331ef3a, 2026-09-23/W1a —
    # 106 commits behind). b428ea9 = tag v1.6.8 — the release-charting
    # commit (== their main, merge PR #92: homehelper tunnel lifecycle
    # logging, release-pipeline repairs).
    ref: b428ea9b7ec9731fe4d53478702d0667cf3f53de
    web_base: "https://github.com/Korrnals/mnemos-mesh/blob/{sha}"
    locale_dirs:
      en: docs/en
      # RU — разовый кураторский перевод 4 страниц, волна W3 (контракт §5);
      # апстрим-зеркала docs/ru у mesh нет.
    include:
      # note для mesh — одна RU-строка: тело страницы остаётся EN (под
      # бейджем «на языке оригинала», контракт §5), интро — голос куратора
      # к RU-читателю нашего корпуса.
      - path: user/getting-started.md
        category: mesh-user
        order: 1
        note: >-
          Куратор: поднять узел mnemos-mesh с нуля — сборка, конфиг двух
          узлов, запуск и проверка канала федерации.
      - path: user/configuration.md
        category: mesh-user
        order: 2
        note: >-
          Куратор: справочник всех полей mesh.yaml — тип, дефолт и смысл
          каждой настройки узла.
      - path: admin/security.md
        category: mesh-admin
        order: 1
        note: >-
          Куратор: модель доверия меша — «глупый транспорт», mTLS, per-peer
          ACL и ключи; то, что оператор узла обязан настроить.
      - path: admin/runbook.md
        category: mesh-admin
        order: 2
        note: >-
          Куратор: эксплуатация меша день за днём — ротация сертификатов,
          добавление и удаление пиров, типовые отказы, метрики.
    exclude:
      - path: adr/
        reason: внутренние ADR апстрима (контракт §3, строка «mesh корень/adr/ROADMAP … нет»)
      - path: architecture.md
        reason: >-
          внутренняя архитектура апстрима; вопрос «завозить ли как обзорную»
          решает Docs Writer W2
      - path: data-topology-scenarios.md
        reason: внутренний дизайн-док апстрима
      - path: w4-assignment-transport.md
        reason: внутренний дизайн-док апстрима
      - path: ROADMAP-v2.md
        reason: роадмап апстрима (контракт §3)
    overlays:
      # W2: ссылка на threat-model ADR уходит в соседний клон (mnemos) —
      # скрипт такие оставляет как есть («escapes»); переписываем на
      # GitHub mnemos @ пина, чтобы в борде не было битого относительного
      # href (контракт §6.1).
      - file: en/admin/security.md
        find: "- [ADR-0016 — federation threat model](../../../../mnemos/docs/project/adr/0016-federation-threat-model.md) (mnemos repo)"
        replace: "- [ADR-0016 — federation threat model](https://github.com/vesmaro/vesmaro/blob/8bc139bf0749c0a50b9f1661e34d33b03ca78e3a/docs/project/adr/0016-federation-threat-model.md) (mnemos repo)"
        reason: >-
          cross-clone ссылка (mesh → mnemos project/adr): относительный путь
          в корпусе борда мёртв — только GitHub @ пина mnemos
    # Кураторские RU-переводы — НАШ слой (контракт §5: «кураторский перевод
    # 4 страниц»), переживают ре-синк: каждый синк переиздаёт ru-слот из
    # curated-источника (provenance kind "curated-translation"). Пути `source`
    # — от корня нашего репо, вне вытираемой зоны content/upstream. Написаны
    # волной W3. ME-039: тела EN идентичны 331ef3a..b428ea9 (diff пуст),
    # перевод не протух — translator_note ниже честно хранит базис перевода
    # (en@331ef3a), обновляется только при изменении EN-тела.
    translations:
      ru:
        - source_of: user/getting-started.md
          source: viewer/src/features/docs/curated/mnemos-mesh/ru/user/getting-started.md
          translator_note: "Кураторский перевод W3; оригинал en@331ef3a785c1"
        - source_of: user/configuration.md
          source: viewer/src/features/docs/curated/mnemos-mesh/ru/user/configuration.md
          translator_note: "Кураторский перевод W3; оригинал en@331ef3a785c1"
        - source_of: admin/security.md
          source: viewer/src/features/docs/curated/mnemos-mesh/ru/admin/security.md
          translator_note: "Кураторский перевод W3; оригинал en@331ef3a785c1"
        - source_of: admin/runbook.md
          source: viewer/src/features/docs/curated/mnemos-mesh/ru/admin/runbook.md
          translator_note: "Кураторский перевод W3; оригинал en@331ef3a785c1"

# ----------------------------------------------------------------------------
# Нормализация L1 (применяется к каждому файлу до overlay и перезаписи ссылок).
# ----------------------------------------------------------------------------
normalize:
  # Строки, целиком совпадающие с маской (fnmatch), вырезаются:
  # языковые переключатели апстрима («🌐 Language / Язык: …»).
  strip_lines_matching:
    - "*🌐 Language / Язык:*"
  # Строки-«чистые» html-комментарии (<!-- ... -->) вырезаются; инлайн-текст
  # не затрагивается.
  strip_html_comment_lines: true
  # 3+ пустые строки подряд схлопываются до одной пустой (value = число \n).
  collapse_blank_lines: 2

# ============================================================================
# API-хаб — /docs/api (директива владельца 2026-09-29, борд ME-038).
#
# Потребитель — scripts/gen_api_ref.py (НЕ sync_docs: один sync-проект = один
# репозиторий, а api-хаб агрегирует ЧЕТЫРЕ источника под одним url-префиксом).
# `npm run sync-docs` гоняет цепочку sync_docs → gen_api_ref: sync_docs
# вытирает content/upstream/* (включая api/), генератор восстанавливает свою
# зону и мержит страницы в provenance.json + manifest.sidecar.json.
# Дисциплина та же, что у sync_docs: L2 генерируется (правка = регенерация),
# пины — полные SHA честных клонов, настенных часов нет (двойной прогон
# байт-в-байт).
# ============================================================================
api_hub:
  url_prefix: api

  # --- источники md-тел (L0: клон + пин; те же L1-правила, что у sync) -----
  sources:
    mnemos:
      repo: ../mnemos
      # Свежий main на момент волны ME-038 (2026-09-29). Пин НЕ пересекается
      # с projects.mnemos (владение ME-039) — это отдельная выборка.
      ref: 8bc139bf0749c0a50b9f1661e34d33b03ca78e3a
      web_base: "https://github.com/vesmaro/vesmaro/blob/{sha}"
      locale_dirs:
        en: docs/en
        ru: docs/ru
      include:
        # A2A Sessions API — единственный API-контракт mnemos, который не
        # входил ни в одну селекцию («поверхность разработчика», решение W2
        # по хабу mnemos). В api-хабе ему законное место; заголовки/тела —
        # из апстрима, ссылки на project/adr уходят на GitHub @ пина.
        - path: architecture/a2a-sessions.md
          slug: mnemos/a2a-sessions
          category: api-mnemos
          order: 2
          title:
            en: A2A Sessions API
            ru: A2A Sessions API
          note:
            en: >-
              Curator: the A2A sessions contract of Mnemos — session
              lifecycle, envelopes, and the design rationale behind the API.
            ru: >-
              Куратор: контракт A2A-сессий mnemos — жизненный цикл сессии,
              конверты и обоснование дизайна API.
      exclude:
        - path: user/http-api.md
          reason: >-
            полный HTTP-справочник уже в корпусе хаба mnemos
            (mnemos/user/http-api) — дубль в двух хабах = два пина одного
            документа; api-хаб держит кураторскую карту-указатель
            (curated api/mnemos/http-api)
        - path: user/mcp-tools.md
          reason: >-
            2429 строк — не компактно (директива: CLI/MCP только если
            компактно); инструментальный слой MCP, не HTTP; уже в хабе
            mnemos
        - path: user/cli-reference.md
          reason: >-
            869 строк, CLI-поверхность (не HTTP API); уже в хабе mnemos
        - path: user/metrics.md
          reason: >-
            три метрических эндпоинта описаны внутри http-api-справочника
            хаба mnemos; отдельная страница в api-хабе не добавляет знания

    vesmaro-agent:
      repo: ../vesmaro-agent
      # Main после squash-мержа PR #2 (ME-053): в протокол вернуто утонувшее
      # доки-обновление релиза 0.6.0 (+104/−40, intake addendum). Агент 0.6.0
      # (ADR 0021 lineage), код не менялся.
      ref: dbd6054ed22c70897247e83c14effbc2e0b7eead
      web_base: "https://github.com/vesmaro/vesmaro-agent/blob/{sha}"
      locale_dirs:
        en: docs
      include:
        - path: PROTOCOL.md
          slug: vesmaro-agent/protocol
          category: api-agent
          order: 1
          title:
            en: "Wire protocol: vesmaro-agent ↔ board"
          note: >-
            Куратор: froze-контекст проводного протокола агента — регистрация
            executor'а, клеймы назначений, отчёты, discovery v3, native
            intake; текст апстрима (EN), статус v0.1-draft.

    mnemos-mesh:
      repo: ../mnemos-mesh
      # Пин для ПРОВЕРКИ кураторской заметки (само тело из curated-слоя).
      ref: b428ea9b7ec9731fe4d53478702d0667cf3f53de
      web_base: "https://github.com/Korrnals/mnemos-mesh/blob/{sha}"
      locale_dirs:
        en: docs/en
      include: []
      exclude:
        - path: docs/
          reason: >-
            публичного HTTP API у меша нет — внутренние gRPC-контракты
            (proto/federation.proto, proto/mnemos_core_api.proto); вместо
            выдумывания — честная кураторская заметка
            (curated api/mnemos-mesh/index)

  # --- vesmaro-eyes board API: OpenAPI-снапшот → страницы ru+en (ME-044) ---
  # title/about — локале-маппинги {ru, en} (как title у include-записей

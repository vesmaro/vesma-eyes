name: identity-guard

# Owner directive (2026-09-23): every commit in this repository is authored
# by the canonical owner identity. The local pre-commit hook
# (scripts/githooks/pre-commit, core.hooksPath) enforces it at commit time;
# this workflow is the server-side net for pushes that bypass a local hook
# (e.g. --no-verify) and for PRs from any other source.
#
# Identity canon (ME-042): only the AUTHOR email (%ae) is checked — the
# canonical owner identity from .mailmap. The COMMITTER email (%ce) is
# deliberately not part of the canon: GitHub rewrites it to
# <noreply@github.com> on web/API merges, and those are this project's own
# merges (see main history: squash merges carry committer=noreply@github.com).
#
# Scan range (ME-042):
# - pull_request: base.sha..head.sha — exactly the PR's own commits. Never
#   github.sha: on pull_request events it is the refs/pull/N/merge test-merge
#   commit authored by GitHub <noreply@github.com>, which would fail every
#   PR structurally.
# - push (branch update): before..after — only the newly pushed commits.
# - push (new branch, before = 000..0): merge-base(origin/main, after)..after
#   — the branch's own commits; if there is no common history with main,
#   the full branch (honest cut of the first-push case).
# - push (branch deletion, after = 000..0): nothing to scan, job is skipped.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  authors:
    runs-on: ubuntu-latest
    # Branch-deletion push events carry a dangling ref and no new commits.
    if: ${{ !github.event.deleted }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit author identities
        run: |
          ALLOWED="153223100+Korrnals@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # new branch: cut at merge-base with main (full scan if unrelated)
              BEFORE="$(git merge-base origin/main "$AFTER" || true)"
            fi
            if [ -n "$BEFORE" ]; then
              RANGE="$BEFORE..$AFTER"
            else
              RANGE="$AFTER"
            fi
          fi
          echo "Scanning $RANGE"
          # A bad range must fail the step loudly, not silently scan nothing.
          LOG="$(git log --format='%H %ae' "$RANGE")"
          BAD="$(printf '%s' "$LOG" | grep -v "$ALLOWED" || true)"
          if [ -n "$BAD" ]; then
            echo "✖ Non-canonical commit authors found (canon: $ALLOWED):"
            echo "$BAD"
            exit 1
          fi
          echo "✓ all commit authors are canonical ($ALLOWED)"
